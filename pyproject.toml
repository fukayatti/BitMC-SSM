[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "bit-mc-ssm"
version = "1.0.0"
description = "Bit-MC-SSM: Zero-GEMM CPU-Native 1.58-bit Language Model powered by BitNet v2 and Delta-SSM"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [
    { name = "BitMC-SSM Contributors" }
]
keywords = [
    "llm",
    "cpu-inference",
    "1-bit",
    "1.58-bit",
    "bitnet",
    "state-space-model",
    "mamba",
    "zero-gemm",
    "simd",
    "quantization"
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: C++",
    "Topic :: Scientific/Engineering :: Artificial Intelligence"
]
dependencies = [
    "torch>=2.0.0",
    "numpy>=1.24.0",
    "tqdm>=4.65.0"
]

[project.urls]
Homepage = "https://github.com/your-username/BitMC-SSM"
Documentation = "https://github.com/your-username/BitMC-SSM#readme"
